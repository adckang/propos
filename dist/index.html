<script>
// [SEC] Toast — alert() 대체. textContent 사용으로 XSS 방지.
window.Toast = {
  show(msg, type='i', ms=3000) {
    const el = document.createElement('div');
    el.className = 'toast toast-' + type;
    el.textContent = msg; // textContent = XSS-safe
    document.getElementById('toast-root').appendChild(el);
    setTimeout(()=>el.remove(), ms);
  },
  success: m => Toast.show(m,'s'),
  error:   m => Toast.show(m,'e'),
  info:    m => Toast.show(m,'i'),
  warn:    m => Toast.show(m,'w'),
};
</script>

.d-k{font-size:12px;color:var(--text2)}
.d-v{font-family:'DM Mono',monospace;font-size:12px;color:var(--text);font-weight:500}
.alert-panel{width:290px;flex-shrink:0;background:var(--surface2);border-left:1px solid var(--border);display:flex;flex-direction:column}
.alert-hdr{padding:12px 14px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;flex-shrink:0;background:var(--surface)}
.alert-list-wrap{flex:1;overflow:auto;padding:8px}

.kv{font-family:'DM Mono',monospace;font-size:16px;font-weight:700;line-height:1}
.kl{font-size:9px;color:var(--text4);letter-spacing:1px;margin-top:3px;text-transform:uppercase}
.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,0.5);z-index:500;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(6px)}
.modal-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);width:580px;max-height:80vh;overflow:auto;padding:28px;box-shadow:var(--shadow-lg)}
.cmd-btn{width:100%;padding:13px 16px;border-radius:var(--radius-sm);border:1.5px solid;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;text-align:left;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;transition:all 0.15s}
.view-wrap{flex:1;overflow:auto;padding:20px}
.vt{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:2px;color:var(--blue);margin-bottom:16px;padding-bottom:10px;border-bottom:2px solid var(--border);text-transform:uppercase}
.rule-row{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:6px}
.cleaner-card{padding:12px 14px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:6px;display:flex;align-items:center;gap:12px}
.progress-bar{height:6px;background:var(--border);border-radius:3px;overflow:hidden;margin-top:10px}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--blue),var(--green));border-radius:3px;transition:width 0.6s}
.rev-row{display:flex;align-items:center;gap:10px;margin-bottom:7px}
.rev-bar{flex:1;height:6px;background:var(--border);border-radius:3px}
.rev-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--blue),var(--green))}
.no-sel{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--text4);font-size:13px;gap:10px}
`;

  const [msgIn, setMsgIn] = useState("");

  useEffect(()=>{const t=setInterval(()=>setNow(new Date()),1000);return()=>clearInterval(t);},[]);

  const netRev = EXPENSES.reduce((s,e)=>s+e.amount,0);

  const sendMsg = t => {
    if(!(t||"").trim())return;
    setMsgs(m=>[...m,{id:Date.now(),from:"host",text:t,time:now.toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit"})}]);

function CommandCenter({onBack}) {
  const [view, setView] = useState("command");

  const [bulkSel, setBulkSel] = useState([]);
  const [gMode, setGMode] = useState("grid");
  const [msgIn, setMsgIn] = useState("");
  const [chat, setChat] = useState([]);
  const [cleanerAss, setCleanerAss] = useState({});
  const [globalMsg, setGlobalMsg] = useState("");

  useEffect(()=>{
    const t=setInterval(()=>setNow(new Date()),1000);
    const t2=setInterval(()=>{
      if(Math.random()<0.12){
        const p=props[randN(0,props.length-1)];
        setAlerts(a=>[{id:Date.now(),type:rand(["warn","info"]),prop:p.name,msg:rand(["게스트 메시지 수신","청소 완료 보고","체크인 완료","Wi-Fi 신호 약화"]),time:new Date().toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit"}),ack:false},...a.slice(0,28)]);
      }
    },9000);
    return()=>{clearInterval(t);clearInterval(t2);};
  },[]);

  const toggleDev = (id,dev) => setProps(p=>p.map(x=>x.id!==id?x:{...x,[dev]:!x[dev]}));
  const adjAc = (id,delta) => setProps(p=>p.map(x=>x.id!==id?x:{...x,acTemp:Math.max(16,Math.min(30,x.acTemp+delta))}));
  const ackAlert = id => setAlerts(a=>a.map(x=>x.id===id?{...x,ack:true}:x));
  const ackAll = () => setAlerts(a=>a.map(x=>({...x,ack:true})));
  const bulkToggle = (dev,val) => setProps(p=>p.map(x=>bulkSel.includes(x.id)?{...x,[dev]:val}:x));

  const filtered = props.filter(p=>{
    if(filter!=="전체"&&p.status!==filter)return false;
    if(search&&!p.name.toLowerCase().includes(search.toLowerCase())&&!(p.guest||"").toLowerCase().includes(search.toLowerCase()))return false;
    return true;
  }).sort((a,b)=>{
    if(sortBy==="priority"){const o={HIGH:0,MED:1,OK:2};return o[a.priority]-o[b.priority];}
    if(sortBy==="revenue")return b.revenue-a.revenue;
    if(sortBy==="rating")return b.rating-a.rating;
    return 0;
  });

  const occupied=props.filter(p=>p.status==="입실중").length;
  const vacant=props.filter(p=>p.status==="공실").length;
  const cleaning=props.filter(p=>p.status==="청소중").length;
  const highAlert=props.filter(p=>p.priority==="HIGH").length;
  const totalMsg=props.reduce((s,p)=>s+p.unreadMsg,0);
  const totalRev=props.reduce((s,p)=>s+p.revenue,0);
  const unack=alerts.filter(a=>!a.ack).length;
  const occ=Math.round((occupied/props.length)*100);

  const PCard = ({p}) => {
    const isSel=selProp?.id===p.id, isBulk=bulkSel.includes(p.id);

      <div className={`pcard ${p.priority} ${isSel?"sel":""}`} onClick={()=>{setSelProp(p);setDTab("info");setChat([]);}}>

              onClick={()=>{setCleanerAss(prev=>({...prev,[p.id]:c.name}));Toast.show(`${c.name}님을 ${p.name.split("#")[0].trim()}에 배정했습니다!`,"s");}}>배정</button>}
          </div>
        ))}
        {cleanerAss[p.id]&&<div style={{marginTop:"10px",padding:"11px 14px",borderRadius:"8px",background:"#ecfdf5",border:"1.5px solid #a7f3d0",fontSize:"13px",color:"#059669",fontWeight:"700"}}>✓ {cleanerAss[p.id]} 배정 완료</div>}
      </div>}
    </>;
  };

  const renderAutomation = () => (
    <div className="view-wrap">
      <div className="vt">자동화 규칙 관리</div>
      {rules.map(r=>(
        <div className="rule-row" key={r.id}>
          <div style={{flex:1}}>
            <div style={{fontSize:"13px",fontWeight:"700",color:"#1a202c"}}>{r.name}</div>
            <div style={{fontSize:"11px",color:"#718096",marginTop:"3px"}}>트리거: {r.trigger} → {r.action}</div>
          </div>
          <button className={`tog ${r.active?"on":""}`} onClick={()=>setRules(rs=>rs.map(x=>x.id===r.id?{...x,active:!x.active}:x))}><div className="tog-d"/></button>
        </div>
      ))}
      <div style={{marginTop:"24px"}}><div className="vt">AI 인사이트</div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"12px"}}>
          {[{ic:"🤖",t:"AI 권장사항",d:"서울 강남 지역 주말 가격 최적화 시 예상 수익 +18%",c:"#2563eb",bg:"#eff6ff"},{ic:"📊",t:"패턴 감지",d:"화~목 공실률 32% — 주중 할인 자동화 권장",c:"#d97706",bg:"#fffbeb"},{ic:"⚡",t:"효율 알림",d:"자동화로 이번 달 절약 시간: 약 14.3시간",c:"#059669",bg:"#ecfdf5"},{ic:"🔮",t:"예측 모델",d:"제주 다음 주 예약률 82% — 청소 인력 사전 배치 권장",c:"#7c3aed",bg:"#f5f3ff"}].map(x=>(
            <div key={x.t} style={{padding:"16px",background:x.bg,border:`1.5px solid ${x.c}22`,borderRadius:"10px",borderLeft:`4px solid ${x.c}`}}>
              <div style={{fontSize:"20px",marginBottom:"8px"}}>{x.ic}</div>
              <div style={{fontSize:"12px",fontWeight:"700",color:x.c,marginBottom:"5px"}}>{x.t}</div>
              <div style={{fontSize:"12px",color:"#4a5568",lineHeight:"1.6"}}>{x.d}</div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );

  const renderRevenue = () => {
    const top = [...props].sort((a,b)=>b.revenue-a.revenue).slice(0,10);
    const maxR = top[0]?.revenue||1;
    const total = props.reduce((s,p)=>s+p.revenue,0);
    return (
      <div className="view-wrap">
        <div className="vt">수익 분석 센터</div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:"12px",marginBottom:"20px"}}>
          {[{l:"총 월 수익",v:`${(total/10000).toFixed(0)}만원`,c:"#059669",bg:"#ecfdf5"},{l:"숙소당 평균",v:`${(total/props.length/10000).toFixed(0)}만원`,c:"#2563eb",bg:"#eff6ff"},{l:"점유율",v:`${occ}%`,c:"#d97706",bg:"#fffbeb"},{l:"수수료 추산",v:`${(total*0.11/10000).toFixed(0)}만원`,c:"#dc2626",bg:"#fef2f2"}].map(k=>(
            <div key={k.l} style={{background:k.bg,border:`1.5px solid ${k.c}22`,borderRadius:"12px",padding:"16px",borderTop:`4px solid ${k.c}`}}>
              <div style={{fontFamily:"'DM Mono',monospace",fontSize:"24px",fontWeight:"700",color:k.c}}>{k.v}</div>
              <div style={{fontSize:"11px",color:"#718096",marginTop:"6px",fontWeight:"600"}}>{k.l}</div>
            </div>
          ))}
        </div>
        <div style={{background:"#fff",border:"1px solid #e2e8f0",borderRadius:"12px",padding:"20px",boxShadow:"0 1px 3px rgba(0,0,0,0.06)"}}>
          <div className="d-label">TOP 10 수익 숙소</div>
          {top.map(p=>(
            <div key={p.id} className="rev-row">
              <span style={{fontSize:"11px",color:"#4a5568",fontWeight:"500",width:"80px",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{p.name.split(" ").slice(-1)[0]}</span>
              <div className="rev-bar"><div className="rev-fill" style={{width:`${(p.revenue/maxR)*100}%`}} /></div>
              <span style={{fontFamily:"'DM Mono',monospace",fontSize:"11px",color:"#059669",fontWeight:"600",width:"55px",textAlign:"right"}}>{(p.revenue/10000).toFixed(0)}만</span>
            </div>
          ))}
        </div>
      </div>
    );
  };

  const renderCleaning = () => {
    const needC = props.filter(p=>p.status==="청소중");
    const issues = props.filter(p=>p.issues.length>0);
    return (
      <div className="view-wrap">
        <div className="vt">청소 · 유지보수 관제</div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"18px"}}>
          <div>
            <div className="d-label">청소 인력 현황</div>
            {CLEANERS.map(c=>(
              <div className="cleaner-card" key={c.id}>
                <div style={{width:"10px",height:"10px",borderRadius:"50%",background:c.status==="가용"?"#059669":c.status==="작업중"?"#d97706":"#cbd5e0",flexShrink:0}} />
                <div style={{flex:1}}>
                  <div style={{fontSize:"13px",fontWeight:"700",color:"#1a202c"}}>{c.name}</div>
                  <div style={{fontSize:"10px",color:"#718096",marginTop:"2px"}}>{c.zone}</div>
                  <div style={{fontSize:"11px",color:c.status==="가용"?"#059669":c.status==="작업중"?"#d97706":"#94a3b8",fontWeight:"600"}}>{c.status}</div>
                </div>
                <div style={{fontFamily:"'DM Mono',monospace",fontSize:"11px",color:"#d97706",fontWeight:"600"}}>★{c.rating}</div>
              </div>
            ))}
          </div>
          <div>
            <div className="d-label">청소 대기 ({needC.length})</div>
            {needC.slice(0,7).map(p=>(
              <div key={p.id} style={{padding:"10px 13px",background:"#fff",border:"1px solid #e2e8f0",borderRadius:"8px",marginBottom:"5px",display:"flex",justifyContent:"space-between",alignItems:"center",boxShadow:"0 1px 2px rgba(0,0,0,0.04)"}}>
                <div>
                  <div style={{fontSize:"12px",fontWeight:"700",color:"#1a202c"}}>{p.name.split(" ").slice(-2).join(" ")}</div>
                  <div style={{fontSize:"10px",color:"#a0aec0",marginTop:"2px"}}>{p.city}</div>
                </div>
                <button className="act-btn" style={{color:"#d97706",borderColor:"#fde68a",background:"#fffbeb",fontSize:"11px",padding:"5px 10px"}}>배정</button>
              </div>
            ))}
          </div>
        </div>
        <div style={{marginTop:"18px"}}>
          <div className="d-label">유지보수 이슈 ({issues.length}건)</div>
          {issues.map(p=>(
            <div key={p.id} style={{padding:"10px 14px",background:"#fef2f2",border:"1.5px solid #fecaca",borderRadius:"8px",marginBottom:"6px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <div>
                <div style={{fontSize:"12px",color:"#dc2626",fontWeight:"700"}}>{p.name}</div>
                <div style={{fontSize:"11px",color:"#dc2626",opacity:0.7,marginTop:"3px"}}>⚠ {p.issues[0]}</div>
              </div>
              <button className="act-btn" style={{color:"#dc2626",borderColor:"#fecaca",background:"#fff",fontSize:"11px",padding:"5px 10px"}}
                onClick={()=>setProps(prev=>prev.map(x=>x.id===p.id?{...x,issues:[],priority:"OK"}:x))}>처리완료</button>
            </div>
          ))}
        </div>
      </div>
    );
  };

  return (
    <div className="app" style={{fontFamily:"'DM Sans',sans-serif"}}>
      {/* KPI TOPBAR */}
      <div style={{height:"54px",background:"#fff",borderBottom:"1px solid #e2e8f0",display:"flex",alignItems:"center",padding:"0 18px",gap:"12px",flexShrink:0,boxShadow:"0 1px 3px rgba(0,0,0,0.06)"}}>
        <div style={{fontFamily:"'Nunito',sans-serif",fontSize:"18px",fontWeight:"800",color:"#2563eb",whiteSpace:"nowrap"}}>PROP<span style={{color:"#dc2626"}}>OS</span></div>
        <div style={{width:"1px",height:"26px",background:"#e2e8f0",flexShrink:0}} />
        <div style={{fontFamily:"'DM Mono',monospace",fontSize:"14px",color:"#4a5568",fontWeight:"500"}}>{now.toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit",second:"2-digit"})}</div>
        <div style={{width:"1px",height:"26px",background:"#e2e8f0",flexShrink:0}} />
        <div className="kpi-top">
          {[[props.length,"전체","#4a5568"],[occupied,"입실중","#059669"],[props.filter(p=>p.status==="예약됨").length,"예약됨","#2563eb"],[vacant,"공실","#94a3b8"],[cleaning,"청소중","#d97706"],[highAlert,"긴급","#dc2626"],[totalMsg,"미읽","#7c3aed"],[`${(totalRev/10000).toFixed(0)}만`,"수익","#059669"],[`${occ}%`,"점유율","#2563eb"]].map(([v,l,c])=>(
            <div key={l} className="kpi-t"><div className="kv" style={{color:c}}>{v}</div><div className="kl">{l}</div></div>
          ))}
        </div>
        <div style={{display:"flex",gap:"8px",alignItems:"center",marginLeft:"auto"}}>
          {bulkSel.length>0&&<div style={{fontSize:"11px",color:"#2563eb",fontFamily:"'DM Mono',monospace",border:"1px solid #bfdbfe",padding:"4px 10px",borderRadius:"20px",background:"#eff6ff",fontWeight:"600"}}>
            {bulkSel.length}개 선택 <span style={{cursor:"pointer",color:"#dc2626",marginLeft:"4px"}} onClick={()=>setBulkSel([])}>×</span>
          </div>}
          <div style={{position:"relative",cursor:"pointer",padding:"6px 12px",borderRadius:"20px",background:unack>0?"#fef2f2":"#f7f9fc",border:`1.5px solid ${unack>0?"#fecaca":"#e2e8f0"}`,display:"flex",alignItems:"center",gap:"6px",fontSize:"12px",color:unack>0?"#dc2626":"#718096",fontWeight:"700"}} onClick={()=>setView(v=>v==="alerts"?"command":"alerts")}>
            🔔 {unack}
            {unack>0&&<div style={{position:"absolute",top:"-2px",right:"-2px",width:"8px",height:"8px",background:"#dc2626",borderRadius:"50%",animation:"pulse 1.5s infinite"}} />}
          </div>
          <button onClick={()=>setShowGcmd(true)} style={{padding:"7px 14px",borderRadius:"20px",background:"#2563eb",border:"none",color:"#fff",fontSize:"12px",fontWeight:"700",cursor:"pointer",fontFamily:"'DM Sans',sans-serif"}}>⚡ 전체 제어</button>
          <button onClick={onBack} className="back-btn">← 홈</button>
        </div>
      </div>

      {/* BODY */}
      <div className="cc-body">
        <div className="cc-sidenav">
          {[["command","◈","지휘"],["automation","⚙","자동화"],["revenue","💰","수익"],["cleaning","🧹","청소"]].map(([id,ic,tip])=>(
            <div key={id} className={`cc-nav-ic ${view===id?"active":""}`} onClick={()=>setView(id)} title={tip}>{ic}</div>
          ))}
        </div>

        <div className="cc-main">
          {view==="command" && <>
            {/* PROP PANEL */}
            <div className="prop-panel">
              <div className="toolbar">
                <input className="srch" placeholder="숙소 검색..." value={search} onChange={e=>setSearch(e.target.value)} />
                <div style={{display:"flex",gap:"3px",flexWrap:"wrap"}}>
                  {["전체","입실중","예약됨","공실","청소중","점검중"].map(f=>(
                    <button key={f} className={`fb ${filter===f?"act":""}`} onClick={()=>setFilter(f)}>{f}</button>
                  ))}
                </div>
                <select style={{background:"#f7f9fc",border:"1.5px solid #e2e8f0",color:"#4a5568",padding:"6px 10px",borderRadius:"20px",fontSize:"12px",fontFamily:"'DM Sans',sans-serif",outline:"none",cursor:"pointer",fontWeight:"600"}} value={sortBy} onChange={e=>setSortBy(e.target.value)}>
                  <option value="priority">우선순위</option>
                  <option value="revenue">수익순</option>
                  <option value="rating">평점순</option>
                </select>
                <div style={{flex:1}} />
                <span style={{fontFamily:"'DM Mono',monospace",fontSize:"11px",color:"#a0aec0",fontWeight:"500"}}>{filtered.length}개</span>
                <div style={{display:"flex",border:"1.5px solid #e2e8f0",borderRadius:"20px",overflow:"hidden"}}>
                  {[["grid","▦"],["list","≡"]].map(([m,ic])=>(
                    <button key={m} onClick={()=>setGMode(m)} style={{padding:"5px 10px",fontSize:"14px",cursor:"pointer",border:"none",background:gMode===m?"#2563eb":"transparent",color:gMode===m?"#fff":"#a0aec0",transition:"all 0.15s"}}>{ic}</button>
                  ))}
                </div>
              </div>
              {gMode==="grid" ? (
                <div className="prop-grid">{filtered.map(p=><PCard key={p.id} p={p}/>)}</div>
              ) : (
                <div className="prop-list">
                  <div className="lrow" style={{cursor:"default",background:"transparent",border:"none",borderBottom:"1px solid #e2e8f0",borderRadius:0,padding:"3px 12px"}}>
                    {[["14px",""],["8px",""],["flex-2","숙소"],["50px","상태"],["flex-1","게스트"],["auto","센서"],["40px","수익"],["30px",""]].map(([w,l],i)=>(
                      <div key={i} style={{[w.includes("flex")?"flex":"width"]:w.replace("flex-",""),fontSize:"10px",color:"#a0aec0",fontWeight:"600"}}>{l}</div>
                    ))}
                  </div>
                  {filtered.map(p=><LRow key={p.id} p={p}/>)}
                </div>
              )}
            </div>

            {/* DETAIL PANEL */}
            <div className="detail-panel">
              <DetailPanel/>
            </div>

            {/* ALERT FEED */}
            <div className="alert-panel">
              <div className="alert-hdr">
                <span style={{fontSize:"12px",fontWeight:"700",color:"#dc2626"}}>🔴 LIVE 알림</span>
                <button onClick={ackAll} style={{fontSize:"10px",color:"#718096",background:"none",border:"1.5px solid #e2e8f0",borderRadius:"20px",padding:"3px 10px",cursor:"pointer",fontFamily:"'DM Sans',sans-serif",fontWeight:"600"}}>전체 확인</button>
              </div>
              <div className="alert-list-wrap">
                {alerts.map(a=>(
                  <div key={a.id} className={`aitem ${a.acked?"acked":""}`}
                    style={{borderLeftColor:{"error":"#dc2626","warn":"#d97706","info":"#2563eb"}[a.type],background:{"error":"#fef2f2","warn":"#fffbeb","info":"#eff6ff"}[a.type]}}>
                    <div style={{fontSize:"10px",fontWeight:"700",color:{"error":"#dc2626","warn":"#d97706","info":"#2563eb"}[a.type],marginBottom:"3px"}}>{a.prop}</div>
                    <div style={{fontSize:"12px",color:"#4a5568",fontWeight:"500"}}>{a.msg}</div>
                    <div style={{fontFamily:"'DM Mono',monospace",fontSize:"10px",color:"#a0aec0",marginTop:"3px"}}>{a.time}</div>
                    {!a.acked&&<button style={{fontSize:"10px",padding:"3px 9px",borderRadius:"20px",border:`1.5px solid ${{error:"#fecaca",warn:"#fde68a",info:"#bfdbfe"}[a.type]}`,cursor:"pointer",background:"#fff",color:{"error":"#dc2626","warn":"#d97706","info":"#2563eb"}[a.type],fontFamily:"'DM Sans',sans-serif",marginTop:"5px",fontWeight:"600"}} onClick={()=>ackAlert(a.id)}>확인</button>}
                  </div>
                ))}
              </div>
            </div>
          </>}

          {view==="automation" && renderAutomation()}
          {view==="revenue" && renderRevenue()}
          {view==="cleaning" && renderCleaning()}
        </div>
      </div>

      {/* GLOBAL CMD MODAL */}
      {showGcmd && (
        <div className="modal-bg" onClick={()=>setShowGcmd(false)}>
          <div className="modal-box" onClick={e=>e.stopPropagation()}>
            <div style={{fontFamily:"'Nunito',sans-serif",fontSize:"18px",fontWeight:"800",color:"#1a202c",marginBottom:"6px"}}>⚡ 글로벌 지휘 센터</div>
            <div style={{fontSize:"12px",color:"#718096",marginBottom:"20px"}}>{bulkSel.length>0?`선택된 ${bulkSel.length}개 숙소에 적용`:`전체 ${props.length}개 숙소에 적용`}</div>
            <div className="d-label">일괄 IoT 제어</div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"8px",marginBottom:"20px"}}>
              {[["🔒 전체 도어락 잠금",()=>bulkToggle("lockOpen",false),"#059669","#ecfdf5","#a7f3d0"],["🔓 전체 도어락 해제",()=>bulkToggle("lockOpen",true),"#dc2626","#fef2f2","#fecaca"],["❄️ 에어컨 전체 ON",()=>bulkToggle("acOn",true),"#2563eb","#eff6ff","#bfdbfe"],["❄️ 에어컨 전체 OFF",()=>bulkToggle("acOn",false),"#718096","#f7f9fc","#e2e8f0"],["💡 조명 전체 ON",()=>bulkToggle("lightsOn",true),"#d97706","#fffbeb","#fde68a"],["💡 조명 전체 OFF",()=>bulkToggle("lightsOn",false),"#718096","#f7f9fc","#e2e8f0"]].map(([l,fn,c,bg,bc])=>(
                <button key={l} className="cmd-btn" style={{color:c,borderColor:bc,background:bg}} onClick={()=>{fn();setShowGcmd(false);}}>
                  {l} <span style={{fontSize:"14px"}}>→</span>
                </button>
              ))}
            </div>
            <div className="d-label">전체 메시지 발송</div>
            <div style={{display:"flex",gap:"8px",marginBottom:"10px"}}>
              <input className="msg-in" placeholder={`입실 중 ${occupied}개 숙소 게스트에게...`} value={globalMsg} onChange={e=>setGlobalMsg(e.target.value)} style={{flex:1}} />
              <button className="act-btn" style={{color:"#fff",borderColor:"#2563eb",background:"#2563eb",fontWeight:"700"}} onClick={()=>{if(globalMsg.trim()){Toast.show(`${occupied}개 숙소 게스트에게 발송: "${globalMsg}"`,"s");setGlobalMsg("");setShowGcmd(false);}}}>전송</button>
            </div>
            <div className="d-label" style={{marginTop:"16px"}}>긴급 액션</div>
            <div style={{display:"flex",gap:"8px"}}>
              <button className="cmd-btn" style={{color:"#dc2626",borderColor:"#fecaca",background:"#fef2f2",flex:1}} onClick={()=>{Toast.show("전체 긴급 알림 발송!","e");setShowGcmd(false);}}>🚨 전체 긴급 알림</button>
              <button className="cmd-btn" style={{color:"#d97706",borderColor:"#fde68a",background:"#fffbeb",flex:1}} onClick={()=>{Toast.show("청소팀 전체 소집!","s");setShowGcmd(false);}}>🧹 청소팀 전체 소집</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

        <div className="topnav-clock">{now.toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit",second:"2-digit"})}</div>

      <div className="topnav">
        <button className="back-btn" onClick={()=>setScreen("landing")}>← 홈</button>

const _d1 = (() => {
  function addDays(dateStr, days) {
    const d = new Date(dateStr + 'T00:00:00Z');
    d.setUTCDate(d.getUTCDate() + days);
    return d.toISOString().slice(0, 10);
  }
  function filterTomorrowCheckIns(bookings, today) {
    if (!Array.isArray(bookings)) return [];
    const tomorrow = addDays(today, 1);
    return bookings.filter(b => b && b.checkIn && b.status === 'confirmed' && b.checkIn.slice(0, 10) === tomorrow);
  }
  function generatePIN() {
    return String(Math.floor(Math.random() * 1000000)).padStart(6, '0');
  }
  function asUTC(s) {
    return (s.endsWith('Z') || s.includes('+')) ? s : s + 'Z';
  }
  function calcExpiry(checkIn, checkOut) {
    const from  = new Date(asUTC(checkIn));
    const until = new Date(asUTC(checkOut));
    return { validFrom: new Date(from.getTime() - 3600000).toISOString(), validUntil: until.toISOString() };
  }
  function buildWelcomeMessage(booking, pinRecord) {
    const { guestName, propName, wifi } = booking;
    const lines = [
      `안녕하세요 ${guestName}님!`,
      `${propName} 내일 체크인 안내드립니다.`,
      ``,
      `도어락 PIN: ${pinRecord.pin}`,
      `체크인: ${booking.checkIn.slice(0, 16).replace('T', ' ')} 이후 입실 가능합니다.`,
    ];
    if (wifi && wifi.ssid) lines.push(`WiFi: ${wifi.ssid} / ${wifi.pw}`);
    lines.push(``, `불편하신 점은 채팅으로 알려주세요.`);
    return lines.join('\n');
  }
  function fmtExpiry(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  }
  return { filterTomorrowCheckIns, generatePIN, calcExpiry, buildWelcomeMessage, fmtExpiry };
})();

const _ical = (() => {
  function parse(text) {
    const unfolded = text.replace(/\r\n[ \t]/g,'').replace(/\r\n/g,'\n').replace(/\n[ \t]/g,'');
    const lines = unfolded.split('\n');
    const events = []; let evt = null;
    for (const line of lines) {
      const t = line.trim();
      if (t === 'BEGIN:VEVENT') { evt = {}; continue; }
      if (t === 'END:VEVENT')   { if (evt) events.push(evt); evt = null; continue; }
      if (!evt) continue;
      const ci = t.indexOf(':'); if (ci < 0) continue;
      const key = t.slice(0, ci).split(';')[0].toUpperCase();
      const val = t.slice(ci + 1);
      if      (key === 'DTSTART')     evt.dtstart = val.replace(/\D/g,'').slice(0,8);
      else if (key === 'DTEND')       evt.dtend   = val.replace(/\D/g,'').slice(0,8);
      else if (key === 'SUMMARY')     evt.summary = val;
      else if (key === 'STATUS')      evt.status  = val.trim().toUpperCase();
      else if (key === 'UID')         evt.uid     = val;
    }
    return events;
  }
  function toBookings(events, cfg) {
    const dt = s => `${s.slice(0,4)}-${s.slice(4,6)}-${s.slice(6,8)}`;
    return events.filter(e => {
      if (!e.dtstart || !e.dtend) return false;
      if (e.status !== 'CONFIRMED') return false;
      const s = (e.summary||'').toLowerCase();
      if (s.includes('not available') || s.includes('blocked') || s === '') return false;
      return true;
    }).map((e, i) => {
      let guestName = e.summary || '게스트';
      if (/^(reserved|airbnb)/i.test(guestName)) guestName = '예약 확정';
      return {
        propId:cfg.propId, propName:cfg.propName, guestName,
        guestId:`${cfg.propId}_${e.uid||i}`,
        checkIn:`${dt(e.dtstart)}T${cfg.checkInTime||'15:00:00'}`,
        checkOut:`${dt(e.dtend)}T${cfg.checkOutTime||'11:00:00'}`,
        status:'confirmed', wifi:cfg.wifi||{ssid:'',pw:''},
      };
    });
  }
  async function fetchViaProxy(url) {
    const res = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(url)}`, { cache:'no-store' });
    if (!res.ok) throw new Error(`프록시 응답 오류 (${res.status})`);
    const json = await res.json();
    if (!json.contents) throw new Error('iCal 내용이 비어있습니다');
    return json.contents;
  }
  return { parse, toBookings, fetchViaProxy };
})();

async function runD1Automation(targets, deps, onProgress) {
  const results = [];
  for (const booking of targets) {
    const result = { propId:booking.propId, propName:booking.propName, guestName:booking.guestName,
      status:'running', steps:{pin:null,message:null,smartHome:null},
      pin:null, expiry:null, welcomeMsg:null, sceneId:null, error:null };
    onProgress([...results, result]);
    const pin = _d1.generatePIN(), expiry = _d1.calcExpiry(booking.checkIn, booking.checkOut);
    result.pin = pin; result.expiry = expiry;
    try {
      await deps.setLockCode(`lock.front_door_${booking.propId.toLowerCase().replace('-','_')}`, pin, `guest_${booking.guestName}`);
      result.steps.pin = true;
    } catch (err) {
      result.steps.pin = false; result.status = 'failed'; result.error = err.message;
      deps.addAlert({ type:'error', prop:booking.propName, msg:`PIN 등록 실패 — ${err.message}`, time:_hhmm() });
      results.push(result); onProgress([...results]); continue;
    }
    try {
      const text = _d1.buildWelcomeMessage(booking, { pin, ...expiry });
      result.welcomeMsg = text;
      await deps.sendMessage(booking.guestId, text);
      result.steps.message = true;
    } catch (err) {
      result.steps.message = false; result.status = 'partial'; result.error = err.message;
      deps.addAlert({ type:'warn', prop:booking.propName, msg:`메시지 발송 실패 — ${err.message}`, time:_hhmm() });
    }
    try {
      const sid = `scene.checkin_ready_${booking.propId.toLowerCase().replace('-','_')}`;
      result.sceneId = sid;
      await deps.activateScene(sid);
      result.steps.smartHome = true;
    } catch (err) {
      result.steps.smartHome = false;
      if (result.status === 'running') result.status = 'partial';
      result.error = err.message;
      deps.addAlert({ type:'warn', prop:booking.propName, msg:`스마트홈 초기화 실패 — ${err.message}`, time:_hhmm() });
    }
    if (result.status === 'running') {
      result.status = 'success';
      deps.addAlert({ type:'info', prop:booking.propName, msg:`D-1 자동화 완료 (PIN ${pin} · 메시지 · 스마트홈)`, time:_hhmm() });
    }
    results.push(result); onProgress([...results]);
  }
  return results;
}

function _hhmm() { const d=new Date(); return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; }

function useCountdownTo1800() {
  const [secs, setSecs] = useState(0);
  useEffect(() => {
    function calc() { const now=new Date(),t=new Date(now); t.setHours(18,0,0,0); if(now>=t) t.setDate(t.getDate()+1); return Math.max(0,Math.floor((t-now)/1000)); }
    setSecs(calc()); const id=setInterval(()=>setSecs(calc()),1000); return ()=>clearInterval(id);
  }, []);
  const h=String(Math.floor(secs/3600)).padStart(2,'0'), m=String(Math.floor((secs%3600)/60)).padStart(2,'0'), s=String(secs%60).padStart(2,'0');
  return { secs, label:`${h}:${m}:${s}` };
}

// ── 도메인 함수 (인라인) ─────────────────────────────────────
const _s02 = (() => {
  function getCheckinWindow(checkIn) {
    const m = String(checkIn).match(/T(\d{2}):(\d{2})/);
    if (!m) return { from: '14:00', until: '20:00' };
    const totalMins = parseInt(m[1], 10) * 60 + parseInt(m[2], 10);
    const pad = n => String(Math.floor(n / 60)).padStart(2,'0') + ':' + String(n % 60).padStart(2,'0');
    return { from: pad(Math.max(0, totalMins - 60)), until: pad(Math.min(23*60+59, totalMins + 5*60)) };
  }
  function isCheckinEvent(haEvent, booking, now) {
    if (haEvent.context !== 'guest_checkin') return false;
    if (booking.status !== 'confirmed')      return false;
    const w = getCheckinWindow(booking.checkIn);
    return now >= w.from && now <= w.until;
  }
  function buildCheckinConfirmMessage(booking, actualTime) {
    const lines = [`${booking.guestName}님, 입실이 확인되었습니다.`, `입실 시각: ${actualTime}`];
    if (booking.checkOut) lines.push(`체크아웃: ${booking.checkOut.slice(0,10)}`);
    lines.push('', '편안한 여행 되세요!', '불편하신 점은 채팅으로 알려주세요.');
    return lines.join('\n');
  }
  function buildPinLockoutAlert(propId, failCount) {
    return `PIN 오류 ${failCount}회 초과 — 도어락 잠금\n게스트 확인 필요 (${propId})`;
  }
  function hhmm() {
    const d = new Date();
    return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  }
  return { getCheckinWindow, isCheckinEvent, buildCheckinConfirmMessage, buildPinLockoutAlert, hhmm };
})();

// ── Mock Infrastructure ──────────────────────────────────────
function makeMockInfraS02(onAlert, onUpdateStatus, sceneFail, channelFail) {
  const delay = ms => new Promise(r => setTimeout(r, ms));
  return {
    activateScene: async () => { await delay(400 + Math.random() * 200); if (sceneFail) throw new Error('HA 503 — 씬 응답 없음'); },
    openChannel:   async () => { await delay(250 + Math.random() * 150); if (channelFail) throw new Error('메시지 서비스 연결 오류'); },
    sendMessage:   async () => { await delay(200 + Math.random() * 100); },
    updateStatus:  (propId, status) => { onUpdateStatus(propId, status); },
    addAlert: onAlert,
  };
}

// ── Real HA Infrastructure ───────────────────────────────────
const _haS02 = (() => {
  const BASE  = _HA_BASE;
  const TOKEN = _HA_TOKEN;
  async function post(path, data) {
    const res = await fetch(`${BASE}${path}`, { method:'POST', headers:{'Authorization':`Bearer ${TOKEN}`,'Content-Type':'application/json'}, body:JSON.stringify(data) });
    if (!res.ok) { const t = await res.text().catch(()=>''); throw new Error(`HA ${res.status}: ${t}`); }
    return res.json().catch(()=>({}));
  }
  async function activateScene(entityId) {
    await post('/api/services/persistent_notification/create', { title:'[PROPOS S02] 체크인 씬 실행', message:`씬: ${entityId}\n시각: ${_s02.hhmm()}`, notification_id:`propos_s02_scene_${entityId.replace(/\W/g,'_')}` });
  }
  async function openChannel(booking) {
    await post('/api/services/persistent_notification/create', { title:`[PROPOS S02] 채팅 채널 오픈 — ${booking.guestName}`, message:`숙소: ${booking.propId}\n체크인: ${booking.checkIn?.slice(0,16).replace('T',' ')}`, notification_id:`propos_s02_ch_${booking.propId}` });
  }
  async function sendMessage(guestId, text) {
    await post('/api/services/persistent_notification/create', { title:`[PROPOS S02] 입실 확인 메시지 — ${guestId}`, message:text, notification_id:`propos_s02_msg_${guestId}` });
  }
  return { activateScene, openChannel, sendMessage };
})();

// ── Application (오케스트레이터) ─────────────────────────────
async function runCheckinAutomation(haEvent, bookings, deps, now, onStepUpdate) {
  const booking = bookings.find(b => b.propId === haEvent.propId);
  if (!booking) return null;
  const currentTime = now || _s02.hhmm();
  if (!_s02.isCheckinEvent(haEvent, booking, currentTime)) return null;
  const result = { propId:booking.propId, propName:booking.propName, guestName:booking.guestName, time:haEvent.time, status:'running', steps:{scene:null,channel:null,message:null}, error:null };
  onStepUpdate({...result});
  try {
    await deps.activateScene(`scene.checkin_welcome_${booking.propId.toLowerCase().replace('-','_')}`);
    result.steps.scene = true;
  } catch(err) {
    result.steps.scene=false; result.status='failed'; result.error=`씬 실행 실패: ${err.message}`;
    deps.addAlert({type:'error',prop:booking.propId,msg:result.error,time:haEvent.time});
    onStepUpdate({...result}); return result;
  }
  onStepUpdate({...result});
  const confirmText = _s02.buildCheckinConfirmMessage(booking, haEvent.time || _s02.hhmm());
  try {
    await deps.openChannel(booking);
    result.steps.channel = true;
  } catch(err) {
    result.steps.channel=false; result.status='partial'; result.error=`채팅 채널 오픈 실패: ${err.message}`;
    deps.addAlert({type:'warn',prop:booking.propId,msg:result.error,time:haEvent.time});
  }
  onStepUpdate({...result});
  try {
    await deps.sendMessage(booking.guestId, confirmText);
    result.steps.message = true;
  } catch(err) {
    result.steps.message=false; if(result.status==='running') result.status='partial';
    result.error=`메시지 발송 실패: ${err.message}`;
    deps.addAlert({type:'warn',prop:booking.propId,msg:result.error,time:haEvent.time});
  }
  onStepUpdate({...result});
  deps.updateStatus(booking.propId,'occupied');
  if(result.status==='running') {
    result.status='success';
    deps.addAlert({type:'info',prop:booking.propId,msg:`입실 감지 — ${booking.guestName}님 체크인 완료 (${haEvent.time})`,time:haEvent.time});
  }
  onStepUpdate({...result});
  return result;
}

// ── StepBadge ────────────────────────────────────────────────
function S02StepBadge({label, state}) {
  const c = state==='running' ? {bg:'#dbeafe',border:'#93c5fd',icon:'↻',text:'#2563eb'}
           : state===true     ? {bg:'#dcfce7',border:'#86efac',icon:'✓',text:'#166534'}
           : state===false    ? {bg:'#fee2e2',border:'#fca5a5',icon:'✕',text:'#dc2626'}
           :                    {bg:'#f1f5f9',border:'#e2e8f0',icon:'·',text:'#94a3b8'};
  return (
    <div style={{display:'flex',alignItems:'center',gap:4,background:c.bg,border:`1px solid ${c.border}`,borderRadius:6,padding:'3px 8px',fontSize:11}}>
      <span style={{color:c.text,fontWeight:700,display:'inline-block',animation:state==='running'?'s02spin 1s linear infinite':'none'}}>{c.icon}</span>
      <span style={{color:c.text}}>{label}</span>
    </div>
  );
}

// ── EventResultCard ───────────────────────────────────────────
function S02EventResultCard({result}) {
  const sc = result.status==='success' ? {bg:'#dcfce7',border:'#86efac',text:'#166534'}
           : result.status==='failed'  ? {bg:'#fee2e2',border:'#fca5a5',text:'#dc2626'}
           : result.status==='partial' ? {bg:'#fffbeb',border:'#fde68a',text:'#92400e'}
           :                             {bg:'#dbeafe',border:'#93c5fd',text:'#1d4ed8'};
  const stepState = (key, prev) => {
    if (result.steps[key] !== null) return result.steps[key];
    if (result.status === 'running' && prev === true) return 'running';
    return null;
  };
  return (
    <div style={{background:sc.bg,border:`1.5px solid ${sc.border}`,borderRadius:8,padding:'10px 12px',marginBottom:8}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}}>
        <div style={{display:'flex',alignItems:'center',gap:6}}>
          <span style={{fontFamily:"'DM Mono',monospace",fontSize:12,fontWeight:700,color:'var(--text)',background:'var(--surface)',border:'1px solid var(--border)',borderRadius:4,padding:'1px 6px'}}>{result.propId}</span>
          <span style={{fontSize:13,fontWeight:600,color:'var(--text)'}}>{result.propName}</span>
          <span style={{fontSize:12,color:'var(--text2)'}}>— {result.guestName}</span>
        </div>
        <div style={{display:'flex',alignItems:'center',gap:6}}>
          <span style={{fontFamily:"'DM Mono',monospace",fontSize:11,color:'var(--text3)'}}>{result.time}</span>
          <span style={{fontSize:11,fontWeight:700,color:sc.text,background:'var(--surface)',border:`1px solid ${sc.border}`,borderRadius:4,padding:'1px 7px'}}>
            {result.status==='success'?'완료':result.status==='failed'?'실패':result.status==='partial'?'부분 완료':'처리 중...'}
          </span>
        </div>
      </div>
      <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
        <S02StepBadge label="① 씬 실행"     state={stepState('scene',   true)} />
        <S02StepBadge label="② 채팅 오픈"   state={stepState('channel', result.steps.scene)} />
        <S02StepBadge label="③ 메시지 발송" state={stepState('message', result.steps.channel)} />
      </div>
      {result.error && (
        <div style={{marginTop:8,fontSize:11,color:'#b91c1c',background:'#fff1f2',border:'1px solid #fca5a5',borderRadius:4,padding:'4px 8px',fontFamily:"'DM Mono',monospace"}}>{result.error}</div>
      )}
    </div>
  );
}

// ── 메인 컴포넌트 ─────────────────────────────────────────────
function S02CheckinPanel({bookings:propBookings}) {
  const bookings = propBookings || DEFAULT_S02_BOOKINGS;
  const [wsStatus,     setWsStatus]     = useState('simulating');
  const [propStatuses, setPropStatuses] = useState(() => Object.fromEntries(bookings.map(b=>[b.propId,'vacant'])));
  const [eventResults, setEventResults] = useState([]);
  const [alerts,       setAlerts]       = useState([]);
  const [running,      setRunning]      = useState(false);
  const [simPropId,    setSimPropId]    = useState('P-042');
  const [simContext,   setSimContext]   = useState('guest_checkin');
  const [simTime,      setSimTime]      = useState('15:12');
  const [sceneFail,    setSceneFail]    = useState(false);
  const [channelFail,  setChannelFail]  = useState(false);
  const [useRealHA,    setUseRealHA]    = useState(false);

  const addAlert    = a  => setAlerts(prev => [{...a, id:Date.now()+Math.random()}, ...prev].slice(0,30));
  const ackAlert    = id => setAlerts(prev => prev.filter(a=>a.id!==id));
  const updateStatus= (propId, status) => setPropStatuses(prev=>({...prev,[propId]:status}));

  const handleEvent = async (haEvent) => {
    if (running) return;
    setRunning(true);
    const deps = useRealHA
      ? {activateScene:_haS02.activateScene, openChannel:_haS02.openChannel, sendMessage:_haS02.sendMessage, updateStatus, addAlert}
      : makeMockInfraS02(addAlert, updateStatus, sceneFail, channelFail);
    setPropStatuses(prev=>({...prev,[haEvent.propId]:'checking_in'}));
    const onStepUpdate = result => {
      setEventResults(prev => {
        const idx = prev.findIndex(r=>r.propId===result.propId&&r.time===result.time);
        if (idx>=0) { const n=[...prev]; n[idx]=result; return n; }
        return [result, ...prev];
      });
    };
    try {
      const result = await runCheckinAutomation(haEvent, bookings, deps, haEvent.time, onStepUpdate);
      if (!result) {
        setPropStatuses(prev=>({...prev,[haEvent.propId]:'vacant'}));
        addAlert({type:'warn',prop:haEvent.propId,msg:`도어락 열림 — 체크인 이벤트 아님 (context: ${haEvent.context}, ${haEvent.time||'?'})`,time:haEvent.time||_s02.hhmm()});
      }
    } catch(err) {
      setPropStatuses(prev=>({...prev,[haEvent.propId]:'vacant'}));
      addAlert({type:'error',prop:haEvent.propId,msg:`예기치 않은 오류: ${err.message}`,time:_s02.hhmm()});
    } finally {
      setRunning(false);
    }
  };

  const simulate = () => handleEvent({event:'door_unlocked',propId:simPropId,time:simTime,context:simContext,failCount:0});

  const handlePinLockout = (propId, failCount) => {
    const time = _s02.hhmm();
    addAlert({type:'error',prop:propId,msg:_s02.buildPinLockoutAlert(propId, failCount),time});
  };

  const connectWS    = () => { setWsStatus('connecting'); setTimeout(()=>setWsStatus('connected'),1200); };
  const disconnectWS = () => setWsStatus('simulating');

  const simWindow   = checkinBook ? _s02.getCheckinWindow(checkinBook.checkIn) : null;
  const timeInWin   = simWindow && simTime>=simWindow.from && simTime<=simWindow.until;

  return (
    <div style={{display:'flex',flexDirection:'column',height:'100%',overflow:'hidden',fontFamily:"'DM Sans',sans-serif"}}>
      <style>{`@keyframes s02spin{to{transform:rotate(360deg)}} @keyframes s02pulse{0%,100%{opacity:1}50%{opacity:0.3}}`}</style>

      {/* 헤더 */}

        <div>
          <div style={{fontSize:14,fontWeight:700,color:'var(--text)'}}>S02 — 체크인 당일 자동화</div>
          <div style={{fontSize:11,color:'var(--text3)',marginTop:1}}>입실 감지 → IoT 씬 실행 → 게스트 채팅 오픈 → 상태 갱신</div>
        </div>
        <div style={{display:'flex',alignItems:'center',gap:8}}>
          <S02WsBadge status={wsStatus} />
          {wsStatus==='simulating'||wsStatus==='disconnected' ? (
            <button onClick={connectWS} style={{padding:'5px 12px',borderRadius:6,background:'#2563eb',border:'1.5px solid #1d4ed8',color:'#fff',fontSize:11,fontWeight:700,cursor:'pointer'}}>HA 연결</button>

// ── 도메인 함수 (인라인) ─────────────────────────────────────
const _s03 = (() => {
  function getDefaultThresholds() {
    return {
      temp:     { warn: 30, critical: 35 },
      humidity: { warn: 80, critical: 90 },
      noise:    { warn: 60, critical: 75 },
      power:    { warn: 3000, critical: 5000 },
    };
  }

  function isAnomaly(reading, thresholds) {
    const SENSORS = ['temp', 'humidity', 'noise', 'power'];
    let highestSeverity = null;
    const anomalySensors = [];
    for (const key of SENSORS) {
      const val = reading[key]; if (val == null) continue;
      const t = thresholds[key]; if (!t) continue;
      if (val > t.critical) {
        anomalySensors.push(key); highestSeverity = 'critical';
      } else if (val > t.warn) {
        anomalySensors.push(key);
        if (highestSeverity !== 'critical') highestSeverity = 'warn';
      }
    }
    return { isAnomaly: anomalySensors.length > 0, severity: highestSeverity, sensors: anomalySensors };
  }

  function buildAnomalyAlert(propId, reading, anomaly) {
    const LABEL = { temp:'온도', humidity:'습도', noise:'소음', power:'전력' };
    const UNIT  = { temp:'°C',  humidity:'%',    noise:'dB',   power:'W' };
    const lines = anomaly.sensors.map(k => `${LABEL[k]||k} ${reading[k]}${UNIT[k]||''} 초과`);
    const badge = anomaly.severity === 'critical' ? '[긴급]' : '[경고]';
    return `${badge} ${propId} — ${lines.join(', ')} — 확인 필요`;
  }

  const REPLY_TEMPLATES = [
    { keywords:['wifi','와이파이','인터넷','wi-fi'],
      build:(b)=>`안녕하세요 ${b.guestName}님!\nWiFi 관련 문의 감사합니다.\nSSID와 비밀번호를 다시 안내드릴게요. 잠시만 기다려 주세요.` },
    { keywords:['덥','뜨겁','더워','춥','cold','hot','온도','에어컨','냉방','난방'],
      build:(b)=>`안녕하세요 ${b.guestName}님!\n실내 온도 불편 사항을 전달해 주셔서 감사합니다.\n에어컨/난방 조절 방법을 안내해 드리겠습니다.` },
    { keywords:['청소','clean','더럽','냄새','쓰레기'],
      build:(b)=>`안녕하세요 ${b.guestName}님!\n불편을 드려 죄송합니다.\n청소 담당자가 신속하게 방문하도록 조치하겠습니다.` },
    { keywords:['체크아웃','checkout','퇴실','떠나','나가'],
      build:(b)=>`안녕하세요 ${b.guestName}님!\n키는 현관에 두시고 문만 닫아 주시면 됩니다. 즐거운 여행 되셨길 바랍니다!` },
  ];

  function buildReplyDraft(msg, booking) {
    const lower = msg.toLowerCase();
    for (const tpl of REPLY_TEMPLATES) {
      if (tpl.keywords.some(kw => lower.includes(kw))) return tpl.build(booking);
    }
    return `안녕하세요 ${booking.guestName}님!\n문의 주셔서 감사합니다.\n확인 후 빠르게 답변 드리겠습니다.`;
  }

  function hhmm() {
    const d = new Date();
    return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  }

  return { getDefaultThresholds, isAnomaly, buildAnomalyAlert, buildReplyDraft, hhmm };
})();

// [R1] haMode 파라미터 제거 — 내부에서 미사용이었음
function makeMockSensorInfra() {
  // Mock: 폴링 횟수를 누적해 5번째마다 이상값 주입
  const base = { temp: 24, humidity: 62, noise: 42, power: 850 };
  let callCount = 0;

  async function getSensorStates(propId) {
    await new Promise(r => setTimeout(r, 300 + Math.random() * 200));
    callCount++;
    // 시뮬레이션: 5번째 폴링마다 이상값 주입 (callCount가 누적되어야 발동)
    const anomalyMode = callCount % 5 === 0;
    return {
      propId,
      time: _s03.hhmm(),
      temp:     base.temp     + (anomalyMode ? 8 : (Math.random() * 4 - 2)),
      humidity: base.humidity + (anomalyMode ? 0 : (Math.random() * 6 - 3)),
      noise:    base.noise    + (Math.random() * 10 - 5),
      power:    base.power    + (Math.random() * 200 - 100),
    };
  }
  return { getSensorStates };
}

// [R2] getDefaultThresholds() 반환값은 상수 — 렌더마다 재생성 방지
const _DEFAULT_THRESHOLDS = _s03.getDefaultThresholds();

// ── Real HA Infrastructure ───────────────────────────────────
const _haS03 = (() => {
  const BASE  = _HA_BASE;
  const TOKEN = _HA_TOKEN;

  async function getState(entityId) {
    const res = await fetch(`${BASE}/api/states/${entityId}`, {
      headers: { 'Authorization': `Bearer ${TOKEN}` },
    });
    if (!res.ok) throw new Error(`HA ${res.status}`);
    const data = await res.json();
    return parseFloat(data.state);
  }

  async function getSensorStates(propId) {
    // TV방 실제 센서 매핑 (없으면 null)
    const [temp] = await Promise.allSettled([
      getState('sensor.temperature_humidity_sensor_temperature'),
    ]);
    return {
      propId,
      time: _s03.hhmm(),
      temp:     temp.status === 'fulfilled' ? temp.value : null,
      humidity: null,
      noise:    null,
      power:    null,
    };
  }

  return { getSensorStates };
})();

  return (

function GuestMessagePanel({ booking, draft, onDraftApply, onNewMessage }) {
  const [inputMsg, setInputMsg] = React.useState('');
  const [sending, setSending] = React.useState(false);

    if (!inputMsg.trim()) return;
    onNewMessage(inputMsg.trim());
    setInputMsg('');

    try {
      await new Promise(r => setTimeout(r, 500));
      onDraftApply(draft);
    } finally {
      // [B3] 예외 발생 시에도 반드시 "발송 중..." 상태 해제

  const currentProp = PROPS.find(p => p.propId === selectedProp) || PROPS[0];

  // ── haMode 변경 시 인프라 교체 ──
  React.useEffect(() => {
    infraRef.current = haMode ? _haS03 : makeMockSensorInfra();
  }, [haMode]);

  // ── 알림 추가 ──
  function addAlert(alert) {
    setAlerts(prev => [alert, ...prev].slice(0, 50));
  }

  // ── 센서 업데이트 ──
  function updateReadings(propId, reading) {
    setReadings(prev => ({ ...prev, [propId]: reading }));
  }

  // ── 단일 숙소 폴링 ──
  async function pollOneProp(prop, infra) {
    try {
      const reading = await infra.getSensorStates(prop.propId);
      updateReadings(prop.propId, reading);

      const anomaly = _s03.isAnomaly(reading, _DEFAULT_THRESHOLDS);
      if (anomaly.isAnomaly) {
        const msg = _s03.buildAnomalyAlert(prop.propId, reading, anomaly);
        addAlert({
          type: anomaly.severity === 'critical' ? 'error' : 'warn',
          prop: prop.propName,
          msg,
          time: reading.time,
        });
      }
      setNetworkError(false);
    } catch (err) {
      setNetworkError(true);
      addAlert({
        type: 'warn',
        prop: prop.propName,
        msg:  `센서 폴링 실패 — 마지막 정상값 유지 (${err.message})`,
        time: _s03.hhmm(),
      });
    }
  }

  // ── 전체 숙소 일괄 폴링 ──
  async function pollAll() {
    const infra = infraRef.current;  // [B1] 유지된 인스턴스 사용
    for (const prop of PROPS) {
      await pollOneProp(prop, infra);
    }
    setLastPoll(_s03.hhmm());
    setCountdown(pollInterval);
  }

  // ── 폴링 시작/중지 ──
  function startPolling() {
    setPolling(true);
    pollAll();

    timerRef.current = setInterval(() => pollAll(), pollInterval * 1000);

    countRef.current = setInterval(() => {
      setCountdown(prev => Math.max(0, prev - 1));
    }, 1000);
  }

  function stopPolling() {
    setPolling(false);
    clearInterval(timerRef.current);
    clearInterval(countRef.current);
    timerRef.current = null;
    countRef.current = null;
  }

  React.useEffect(() => {
    return () => {
      clearInterval(timerRef.current);
      clearInterval(countRef.current);
    };
  }, []);

  // 폴링 간격 변경 시 재시작
  React.useEffect(() => {
    if (polling) {
      clearInterval(timerRef.current);
      timerRef.current = setInterval(() => pollAll(), pollInterval * 1000);
      setCountdown(pollInterval);
    }
  }, [pollInterval]);

  // ── 게스트 메시지 처리 ──

    // [B2] msg.text 검증 — 빈 문자열이면 buildReplyDraft에서 throw 발생하므로 조기 종료

      msg:  `AI 답장 초안 생성 완료`,

// 퇴실 감지 → PIN 즉시 만료 → 청소팀 자동 배정 → 체크리스트

const _s04 = (() => {
  function getCheckoutWindow(checkOut) {
    const d = new Date(checkOut);
    const from  = new Date(d.getTime() - 2 * 60 * 60 * 1000);
    const until = new Date(d.getTime() + 3 * 60 * 60 * 1000);
    const fmt = (dt) =>
      dt.getHours().toString().padStart(2, '0') + ':' +
      dt.getMinutes().toString().padStart(2, '0');
    return { from: fmt(from), until: fmt(until) };
  }

  function isCheckoutEvent(event, booking, now) {
    const validEvents = ['door_locked', 'manual_checkout'];
    if (!validEvents.includes(event.event)) return false;
    if (!['confirmed', 'occupied'].includes(booking.status)) return false;
    const w = getCheckoutWindow(booking.checkOut);
    const toMin = (t) => { const [h, m] = t.split(':').map(Number); return h * 60 + m; };
    const n = toMin(now), f = toMin(w.from), u = toMin(w.until);
    return n >= f && n <= u;
  }

  function assignCleaner(cleaners, propId, checkoutTime) {
    const available = cleaners.filter(c => c.available);
    if (available.length === 0) throw new Error('가용 청소팀 없음');
    const selected = available.reduce((min, c) => c.activeJobs < min.activeJobs ? c : min, available[0]);
    const [h, m] = checkoutTime.split(':').map(Number);
    const total = h * 60 + m + 30;
    const arrival = `${Math.floor(total / 60) % 24}`.padStart(2, '0') + ':' + `${total % 60}`.padStart(2, '0');
    return { propId, cleanerId: selected.id, cleanerName: selected.name, assignedAt: checkoutTime, estimatedArrival: arrival, status: 'assigned' };
  }

  function buildChecklist(propId) {
    return [
      { id: `${propId}-cl-01`, label: '침구 교체',              done: false, priority: 'required' },
      { id: `${propId}-cl-02`, label: '화장실 청소',             done: false, priority: 'required' },
      { id: `${propId}-cl-03`, label: '주방 청소',               done: false, priority: 'required' },
      { id: `${propId}-cl-04`, label: '바닥 청소',               done: false, priority: 'required' },
      { id: `${propId}-cl-05`, label: '쓰레기 비우기',           done: false, priority: 'required' },
      { id: `${propId}-cl-06`, label: '도어락 PIN 초기화 확인',  done: false, priority: 'required' },
      { id: `${propId}-cl-07`, label: '에어컨 필터 청소',        done: false, priority: 'optional' },
      { id: `${propId}-cl-08`, label: '창문 닦기',               done: false, priority: 'optional' },
    ];
  }

  function hhmm() {
    const d = new Date();
    return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  }

  return { isCheckoutEvent, getCheckoutWindow, assignCleaner, buildChecklist, hhmm };
})();

function PinExpireCountdown({ active, onDone }) {
  const [count, setCount] = React.useState(5);
  React.useEffect(() => {
    if (!active) return;
    setCount(5);
    const iv = setInterval(() => {
      setCount(prev => {
        if (prev <= 1) { clearInterval(iv); onDone(); return 0; }
        return prev - 1;
      });
    }, 1000);
    return () => clearInterval(iv);
  }, [active]);
  if (!active) return null;
  return (
    <div style={{ display:'flex', alignItems:'center', gap:10, background:'#fef2f2', border:'2px solid #fca5a5', borderRadius:10, padding:'10px 16px' }}>

function ChecklistRowS04({ item, onToggle }) {
  return (
    <div onClick={() => onToggle(item.id)} style={{ display:'flex', alignItems:'center', gap:10, padding:'7px 8px', borderRadius:6, cursor:'pointer', background:item.done?'#f0fdf4':'transparent', transition:'background 0.2s', marginBottom:2 }}>
      <div style={{ width:18, height:18, borderRadius:4, border:`2px solid ${item.done?'#16a34a':'#cbd5e1'}`, background:item.done?'#16a34a':'#ffffff', display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0, transition:'all 0.15s' }}>
        {item.done && <span style={{ color:'#ffffff', fontSize:11, fontWeight:700 }}>✓</span>}
      </div>
      <span style={{ fontSize:13, color:item.done?'#16a34a':'#1e293b', textDecoration:item.done?'line-through':'none', fontWeight:item.done?400:500 }}>{item.label}</span>
    </div>
  );
}

function CleaningChecklistS04({ items, onToggle, onFinalize, propStatus }) {
  if (!items || items.length === 0) return null;
  const required = items.filter(i => i.priority === 'required');
  const optional = items.filter(i => i.priority === 'optional');
  const doneCount = items.filter(i => i.done).length;
  const requiredDone = required.every(i => i.done);
  const progress = Math.round((doneCount / items.length) * 100);
  return (
    <div style={{ background:'#ffffff', border:'1px solid #e2e8f0', borderRadius:12, padding:'16px 20px' }}>
      <div style={{ display:'flex', alignItems:'center', gap:8, marginBottom:12 }}>
        <span style={{ fontSize:18 }}>📋</span>
        <span style={{ fontWeight:700, fontSize:14, color:'#1e293b' }}>청소 체크리스트</span>
        <span style={{ marginLeft:'auto', fontFamily:"'DM Mono',monospace", fontSize:12, color:'#64748b' }}>{doneCount}/{items.length}</span>
      </div>
      <div style={{ height:6, background:'#f1f5f9', borderRadius:3, marginBottom:14 }}>
        <div style={{ height:'100%', width:`${progress}%`, background:progress===100?'#16a34a':'#2563eb', borderRadius:3, transition:'width 0.4s ease' }} />
      </div>
      <div style={{ marginBottom:10 }}>
        <div style={{ fontSize:11, fontWeight:600, color:'#dc2626', textTransform:'uppercase', letterSpacing:'0.05em', marginBottom:6 }}>필수 항목</div>
        {required.map(item => <ChecklistRowS04 key={item.id} item={item} onToggle={onToggle} />)}
      </div>
      <div style={{ marginBottom:14 }}>
        <div style={{ fontSize:11, fontWeight:600, color:'#64748b', textTransform:'uppercase', letterSpacing:'0.05em', marginBottom:6 }}>선택 항목</div>
        {optional.map(item => <ChecklistRowS04 key={item.id} item={item} onToggle={onToggle} />)}
      </div>
      {propStatus === 'cleaning' && (
        <button onClick={onFinalize} disabled={!requiredDone} style={{ width:'100%', padding:'10px 0', borderRadius:8, border:`1.5px solid ${requiredDone?'#16a34a':'#e2e8f0'}`, background:requiredDone?'#16a34a':'#f8fafc', color:requiredDone?'#ffffff':'#94a3b8', fontSize:13, fontWeight:700, cursor:requiredDone?'pointer':'default', transition:'all 0.2s' }}>
          {requiredDone ? '✓ 청소 완료 — 숙소 준비 완료 처리' : `필수 항목 ${required.filter(i=>!i.done).length}개 남음`}
        </button>
      )}
    </div>
  );
}

function AlertFeedS04({ alerts, onAck, onAckAll }) {

    <div style={{ textAlign:'center', padding:'24px 0', color:'#94a3b8', fontSize:13 }}>알림 없음 — 대기 중</div>

  const [propStatuses, setPropStatuses] = React.useState(() =>
    Object.fromEntries(_S04_PROPS.map(p => [p.propId, p.status]))
  );
  const [assignments,  setAssignments]  = React.useState({});
  const [checklists,   setChecklists]   = React.useState({});
  const [alerts,       setAlerts]       = React.useState([]);
  const [processing,   setProcessing]   = React.useState(false);
  const [pinCountdown, setPinCountdown] = React.useState(false);
  const [pinDone,      setPinDone]      = React.useState({});

  const currentBooking = _S04_PROPS.find(p => p.propId === selectedProp);
  const currentStatus  = propStatuses[selectedProp] || 'occupied';
  const currentAssign  = assignments[selectedProp] || null;
  const currentItems   = checklists[selectedProp] || null;

  function getInfra() { return haMode ? _haRealS04 : _haMockS04; }

  function addAlert(alert) {
    setAlerts(prev => [alert, ...prev].slice(0, 50));
  }

  async function handleCheckoutEvent(eventType) {
    if (processing) return;
    setProcessing(true);
    const now = _s04.hhmm();
    const event = { event: eventType, propId: selectedProp, time: now };
    const booking = currentBooking;

    if (!booking) {
      addAlert({ type:'warn', prop:selectedProp, msg:'예약 정보 없음', time:now });
      setProcessing(false);
      return;
    }

    if (!_s04.isCheckoutEvent(event, booking, now)) {
      const w = _s04.getCheckoutWindow(booking.checkOut);
      addAlert({ type:'warn', prop:booking.propName, msg:`체크아웃 이벤트 아님 — 시간창(${w.from}~${w.until}) 밖이거나 상태 불일치`, time:now });
      setProcessing(false);
      return;
    }

    setPinCountdown(true);
    try {
      await getInfra().expirePin(`lock.front_door_${selectedProp.toLowerCase().replace('-','_')}`);
      setPinDone(prev => ({ ...prev, [selectedProp]: true }));
      addAlert({ type:'info', prop:booking.propName, msg:'PIN 만료 완료 — 도어락 비활성화', time:_s04.hhmm() });

      const assignment = _s04.assignCleaner(_S04_CLEANERS, selectedProp, now);
      setAssignments(prev => ({ ...prev, [selectedProp]: assignment }));
      addAlert({ type:'info', prop:booking.propName, msg:`청소팀 배정 완료 — ${assignment.cleanerName} 도착예정 ${assignment.estimatedArrival}`, time:_s04.hhmm() });

      const items = _s04.buildChecklist(selectedProp);
      setChecklists(prev => ({ ...prev, [selectedProp]: items }));

      setPropStatuses(prev => ({ ...prev, [selectedProp]: 'cleaning' }));
      addAlert({ type:'info', prop:booking.propName, msg:`${selectedProp} 체크아웃 완료 — ${booking.guestName}님 퇴실 (${now})`, time:now });
    } catch (err) {
      addAlert({ type:'error', prop:booking.propName, msg:`체크아웃 자동화 오류: ${err.message}`, time:_s04.hhmm() });

      setProcessing(false);
    }
  }

  function toggleChecklistItem(itemId) {
    setChecklists(prev => {
      const items = prev[selectedProp] || [];

    });
  }

  function handleFinalizeClean() {
    setPropStatuses(prev => ({ ...prev, [selectedProp]: 'vacant' }));

  const infoCount  = alerts.filter(a => a.type === 'info').length;

    <div style={{ minHeight:'100vh', background:'#f0f4f8', fontFamily:"'DM Sans','Nunito',sans-serif" }}>

// ── 도메인 함수 (인라인) ─────────────────────────────────────
const _s05 = (() => {
  function aggregateRevenue(platforms, operatingCost = 0) {
    let totalGross = 0, totalFee = 0, totalNet = 0;
    const byPlatform = {};
    for (const [platform, data] of Object.entries(platforms)) {
      totalGross += data.gross; totalFee += data.platformFee; totalNet += data.net;
      byPlatform[platform] = { ...data };
    }
    return { totalGross, totalFee, totalNet, byPlatform, operatingCost, operatingProfit: totalNet - operatingCost };
  }
  function calcTax(rev) {
    const { operatingProfit, totalGross, totalFee } = rev;
    const vat = Math.round(operatingProfit * 0.10), incomeTaxEstimate = Math.round(operatingProfit * 0.15);
    return { vat, incomeTaxEstimate, netAfterTax: operatingProfit - vat, deductions: [
      { item:'플랫폼 수수료', amount:totalFee },
      { item:'청소비', amount:Math.round(totalGross*0.03) },
      { item:'유지보수비', amount:Math.round(totalGross*0.02) },
    ]};
  }
  const _TREND = { spring_peak:1.10, summer_peak:1.15, off_season:0.90, normal:1.00 };
  function getPricingRecommendations(propDataList, marketTrend='normal') {
    const mult = _TREND[marketTrend]??1.00;
    let sumCurrent=0, sumSuggested=0;
    const recommendations = propDataList.map(({propId,occupancy,avgNightlyRate,competitorAvg})=>{
      let suggestedRate;
      if(occupancy>0.85) suggestedRate=Math.round(competitorAvg*mult);
      else if(occupancy>0.70) suggestedRate=Math.round(Math.max(avgNightlyRate,competitorAvg)*mult);
      else suggestedRate=Math.round(avgNightlyRate*mult);
      let confidence=0.60;
      if(occupancy>0.85) confidence+=0.15;
      if(avgNightlyRate<competitorAvg) confidence+=0.10;
      if(marketTrend!=='normal') confidence+=0.10;
      confidence=Math.min(confidence,0.95);
      const rp=[];
      if(occupancy>0.85) rp.push('높은 점유율');
      if(avgNightlyRate<competitorAvg) rp.push('경쟁사 대비 저평가');
      if(marketTrend!=='normal'){const tl={spring_peak:'봄 성수기',summer_peak:'여름 성수기',off_season:'비수기'};rp.push(tl[marketTrend]||marketTrend);}
      sumCurrent+=avgNightlyRate; sumSuggested+=suggestedRate;
      return {propId,currentRate:avgNightlyRate,suggestedRate,confidence,reason:rp.join(' + ')||'성수기 보정'};
    });
    const pct=sumCurrent>0?Math.round((sumSuggested-sumCurrent)/sumCurrent*100):0;
    return {recommendations,projectedRevenueIncrease:`+${pct}%`,totalProjected:Math.round(sumSuggested)};
  }
  function won(n){return n.toLocaleString('ko-KR')+'원';}
  function hhmm(){const d=new Date();return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;}
  return {aggregateRevenue,calcTax,getPricingRecommendations,won,hhmm};
})();

async function _fetchWithRetryS05(fetchFn,maxRetries,platform,addAlert){
  let lastErr;
  for(let attempt=1;attempt<=maxRetries;attempt++){
    try{return await fetchFn();}
    catch(err){
      lastErr=err;
      const time=_s05.hhmm();
      if(attempt<maxRetries) addAlert({type:'warn',prop:'SYSTEM',msg:`${platform} API 응답 없음\n5분 후 재시도 예정 (${attempt}/${maxRetries})`,time});
      else addAlert({type:'error',prop:'SYSTEM',msg:`${platform} API ${maxRetries}회 시도 실패 — 수동 처리 필요`,time});
    }
  }
  throw new Error(`${platform} API 실패 (${maxRetries}회): ${lastErr?.message}`);
}

          </label>
          <button onClick={running?undefined:runSettlement} disabled={running} style={{padding:'6px 16px',borderRadius:7,border:`1.5px solid ${running?'#e2e8f0':'#059669'}`,background:running?'#f8fafc':'#059669',color:running?'#94a3b8':'#fff',fontSize:12,fontWeight:700,cursor:running?'default':'pointer',display:'flex',alignItems:'center',gap:6,transition:'all 0.2s'}}>
            {running?<><div style={{width:12,height:12,border:'2px solid #94a3b8',borderTopColor:'transparent',borderRadius:'50%',animation:'spin 0.8s linear infinite'}}/>정산 중...</>:`▶ ${month}월 정산 실행`}
          </button>
          {allDone&&<button onClick={resetAll} style={{padding:'6px 12px',borderRadius:7,border:'1.5px solid #e2e8f0',background:'#f8fafc',color:'#64748b',fontSize:12,fontWeight:600,cursor:'pointer'}}>↺ 초기화</button>}
        </div>
      </div>
      <div style={{flex:1,overflow:'auto',padding:20}}>
        <div style={{background:'#ffffff',border:'1px solid #e2e8f0',borderRadius:12,padding:'16px 24px',marginBottom:16}}>
          <SettlementProgress steps={steps} running={running}/>
          {allDone&&<div style={{textAlign:'center',color:'#059669',fontSize:13,fontWeight:700,marginTop:4}}>✓ {month}월 정산 완료 — 모든 단계 성공</div>}
        </div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:16}}>
          <div style={{display:'flex',flexDirection:'column',gap:12}}>
            <div style={{fontWeight:700,fontSize:12,color:'#64748b',textTransform:'uppercase',letterSpacing:'0.05em'}}>플랫폼별 수익</div>
            <PlatformCardS05 platform="에어비앤비" data={airbnbData}  icon="🏠" color="#FF5A5F"/>
            <PlatformCardS05 platform="야놀자"     data={yanoljaData} icon="🌙" color="#0078FF"/>
            {revenueData&&<RevenueSummaryCardS05 revenueData={revenueData}/>}
          </div>
          <div style={{display:'flex',flexDirection:'column',gap:12}}>
            <div style={{fontWeight:700,fontSize:12,color:'#64748b',textTransform:'uppercase',letterSpacing:'0.05em'}}>AI 가격 최적화</div>
            {pricingData?(<PricingRecommendationListS05 pricingData={pricingData} selectedProps={selectedProps} onToggleProp={toggleProp} onApply={applyPricing} applying={applying}/>):(
              <div style={{background:'#f8fafc',border:'1px solid #e2e8f0',borderRadius:10,padding:'24px',textAlign:'center',color:'#94a3b8',fontSize:12}}>정산 실행 후 AI 분석 결과가 표시됩니다</div>
            )}
          </div>
          <div style={{display:'flex',flexDirection:'column',gap:12}}>
            <div style={{fontWeight:700,fontSize:12,color:'#64748b',textTransform:'uppercase',letterSpacing:'0.05em'}}>세금 리포트</div>
            {taxData?(<TaxReportCardS05 taxData={taxData}/>):(
              <div style={{background:'#f8fafc',border:'1px solid #e2e8f0',borderRadius:10,padding:'24px',textAlign:'center',color:'#94a3b8',fontSize:12}}>정산 실행 후 세금 리포트가 표시됩니다</div>
            )}
            <div style={{fontWeight:700,fontSize:12,color:'#64748b',textTransform:'uppercase',letterSpacing:'0.05em',marginTop:4}}>자동화 알림</div>
            <div style={{background:'#ffffff',border:'1px solid #e2e8f0',borderRadius:12,padding:'12px',maxHeight:280,overflowY:'auto'}}>
              <AlertFeedS05 alerts={alerts} onAck={ackAlert}/>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
